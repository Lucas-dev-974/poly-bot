# Polymarket Bot - Production Docker Compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: polymarket-bot:latest
    container_name: polymarket-bot
    restart: unless-stopped
    user: "1001:1001"
    env_file:
      - .env.prod
    volumes:
      - ./data:/app/data
      - ./config/presets:/app/config/presets:ro
    # NOTE: no ports here on purpose. Port mappings live ONLY in variant files
    # (compose MERGES port lists across -f files; a base mapping can never be
    # "replaced" reliably across versions). Each variant adds exactly one:
    #   docker-compose.no-domain.yml → "3105:3105"          (direct IP access)
    #   docker-compose.prod.yml      → "127.0.0.1:3105:3105" (Nginx proxied)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3105/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

