# Polymarket Bot - Production Docker Compose (no domain, direct IP access)
# Usage: docker compose -f docker-compose.yml -f docker-compose.no-domain.yml up -d

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: polymarket-bot:latest
    container_name: polymarket-bot
    restart: unless-stopped
    user: "1001:1001"
    env_file:
      - .env.prod
    volumes:
      - ./data:/app/data
      - ./config/presets:/app/config/presets:ro
    ports:
      - "3105:3105"  # Direct access on all interfaces (base file has no ports)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3105/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"